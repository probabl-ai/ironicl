[package]
name = "ironicl"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
publish = false
description = "A cache-aware CPU inference engine for TabICLv2"

[lib]
name = "ironicl"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "ironicl"
path = "src/main.rs"

[features]
default = []
metal = [
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-metal",
    "dep:objc2-metal-performance-shaders",
    "dep:objc2-metal-performance-shaders-graph",
]
# Force the scalar reference GELU, softmax, and LayerNorm instead of the bounded
# native approximations, for exact PyTorch parity debugging and control runs.
exact-math = []
profile = []
python = ["dep:pyo3"]
# NVIDIA GPUs through the kernels in src/kernels/cuda/kernels.rs (Linux). Builds only
# through cuda-oxide's codegen backend: see tools/cuda-env.sh.
cuda = ["dep:cuda-core", "dep:cuda-device", "dep:cuda-host"]

[dependencies]
# cuda-oxide: one revision for all three and for the codegen backend.
cuda-core = { git = "https://github.com/NVIDIA/cuda-rust", rev = "a0a4dc78a20e06ec90827f597e950bdc49f723e2", optional = true }
cuda-device = { git = "https://github.com/NVIDIA/cuda-rust", rev = "a0a4dc78a20e06ec90827f597e950bdc49f723e2", optional = true }
cuda-host = { git = "https://github.com/NVIDIA/cuda-rust", rev = "a0a4dc78a20e06ec90827f597e950bdc49f723e2", optional = true }
half = "2.7"
bytemuck = "1.25.2"
# Exact pin: Candle's pickle reader is on the checkpoint trust boundary.
candle-core = "=0.11.1"
libm = "0.2.16"
memmap2 = "0.9.12"
pyo3 = { version = "0.30.1", features = ["abi3-py312"], optional = true }
rand_mt = { version = "6.1.0", default-features = false }
rayon = "1.12.0"
sha2 = "0.11.1"
tempfile = "3.27.0"
zip = { version = "9.3.0", default-features = false }

[dev-dependencies]
serde_json = "1.0.154"

# Windows memory: the planner's probe (memory status, job limits, commit
# charge) and prefetching mapped contexts.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

# The Metal backend: Apple Silicon only, behind the `metal` feature.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
objc2 = { version = "0.6.5", optional = true }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSValue",
], optional = true }
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "MTLAllocation",
    "MTLBuffer",
    "MTLCommandQueue",
    "MTLDevice",
    "MTLResource",
], optional = true }
objc2-metal-performance-shaders = { version = "0.3.2", default-features = false, features = [
    "std",
    "MPSCoreTypes",
], optional = true }
objc2-metal-performance-shaders-graph = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-metal-performance-shaders",
    "MPSGraph",
    "MPSGraphActivationOps",
    "MPSGraphArithmeticOps",
    "MPSGraphCore",
    "MPSGraphDevice",
    "MPSGraphExecutable",
    "MPSGraphMatrixMultiplicationOps",
    "MPSGraphMemoryOps",
    "MPSGraphNormalizationOps",
    "MPSGraphOperation",
    "MPSGraphReductionOps",
    "MPSGraphTensor",
    "MPSGraphTensorData",
    "MPSGraphTensorShapeOps",
], optional = true }

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
# Every `unsafe` block states the invariant that makes it sound.
undocumented_unsafe_blocks = "warn"
# Every lint allow or expect says why.
allow_attributes_without_reason = "warn"

# One codegen unit and fat LTO let the kernels inline into their callers: about
# 7% faster CPU fit and predict (M1 Max), for a slower release build.
[profile.release]
lto = "fat"
codegen-units = 1
