[package]
name = "ironicl"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
publish = false
description = "A cache-aware CPU inference engine for TabICLv2"

[lib]
name = "ironicl"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "ironicl"
path = "src/main.rs"

[features]
default = ["checkpoint"]
checkpoint = ["dep:candle-core", "dep:zip"]
metal = [
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-metal",
    "dep:objc2-metal-performance-shaders",
    "dep:objc2-metal-performance-shaders-graph",
]
# Force the scalar reference GELU, softmax, and LayerNorm instead of the bounded
# native approximations, for exact PyTorch parity debugging and control runs.
exact-math = []
# Dormant experiments, off by default and never activated by a runtime flag.
# Build with one to compile its code path back in. See docs/experiments.md.
bf16-dense = []
bf16-value-dot = []
sparse-attention = []
attention-stats = []
experimental = ["bf16-dense", "bf16-value-dot", "sparse-attention", "attention-stats"]
profile = []
python = ["checkpoint", "dep:pyo3"]

[dependencies]
bytemuck = "1.25.2"
# Exact pin: Candle's pickle reader is on the checkpoint trust boundary.
candle-core = { version = "=0.11.1", optional = true }
libm = "0.2.16"
memmap2 = "0.9.12"
pyo3 = { version = "0.30.1", features = ["abi3-py312"], optional = true }
rayon = "1.12.0"
sha2 = "0.11.1"
zip = { version = "9.3.0", default-features = false, optional = true }

# The Metal backend: Apple Silicon only, behind the `metal` feature.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
objc2 = { version = "0.6.5", optional = true }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSValue",
], optional = true }
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "MTLAllocation",
    "MTLBuffer",
    "MTLCommandQueue",
    "MTLDevice",
    "MTLResource",
], optional = true }
objc2-metal-performance-shaders = { version = "0.3.2", default-features = false, features = [
    "std",
    "MPSCoreTypes",
], optional = true }
objc2-metal-performance-shaders-graph = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-metal-performance-shaders",
    "MPSGraph",
    "MPSGraphActivationOps",
    "MPSGraphArithmeticOps",
    "MPSGraphCore",
    "MPSGraphDevice",
    "MPSGraphExecutable",
    "MPSGraphMatrixMultiplicationOps",
    "MPSGraphMemoryOps",
    "MPSGraphNormalizationOps",
    "MPSGraphOperation",
    "MPSGraphReductionOps",
    "MPSGraphTensor",
    "MPSGraphTensorData",
    "MPSGraphTensorShapeOps",
], optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
