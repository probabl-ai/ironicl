[package]
name = "ironicl"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
publish = false
description = "A cache-aware CPU inference engine for TabICLv2"

[lib]
name = "ironicl"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "ironicl"
path = "src/main.rs"

[features]
default = ["checkpoint"]
checkpoint = ["dep:candle-core", "dep:zip"]
profile = []
python = ["checkpoint", "dep:pyo3"]

[dependencies]
bytemuck = "1.25.2"
# Exact pin: Candle's pickle reader is on the checkpoint trust boundary.
candle-core = { version = "=0.11.1", optional = true }
libm = "0.2.16"
memmap2 = "0.9.12"
pyo3 = { version = "0.30.1", features = ["abi3-py312"], optional = true }
rayon = "1.12.0"
sha2 = "0.11.1"
zip = { version = "9.3.0", default-features = false, optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
