name: Python preprocessing

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Python lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install ruff==0.17.3
      - name: Lint Python sources
        run: make lint-python

  standalone:
    name: Standalone package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install --no-self-update
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          # The default build creates the wheel from the sdist, not the checkout.
          python -m build
      - name: Verify project and upstream licenses in both distributions
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          sdist, = Path("dist").glob("*.tar.gz")
          wheel, = Path("dist").glob("*.whl")
          with tarfile.open(sdist) as source, zipfile.ZipFile(wheel) as binary:
              for license_path in ("LICENSE", "LICENSES/TabICL-BSD-3-Clause.txt"):
                  license_text = Path(license_path).read_bytes()
                  member = f"{sdist.name.removesuffix('.tar.gz')}/{license_path}"
                  assert source.extractfile(member).read() == license_text, f"sdist {license_path} differs"
                  member, = [name for name in binary.namelist() if name.endswith(f"/licenses/{license_path}")]
                  assert binary.read(member) == license_text, f"wheel {license_path} differs"
          PY
      - name: Create isolated test environment
        run: |
          python -m venv "$RUNNER_TEMP/standalone"
          echo "$RUNNER_TEMP/standalone/bin" >> "$GITHUB_PATH"
      - name: Install and test the wheel without upstream dependencies
        env:
          PYTHONPATH: ""
        run: |
          python -m pip install dist/*.whl
          python - <<'PY'
          from importlib.util import find_spec
          from pathlib import Path
          import sys
          import ironicl

          assert Path(ironicl.__file__).resolve().is_relative_to(Path(sys.prefix).resolve()), "not testing the installed package"
          for name in ("tabicl", "torch"):
              assert find_spec(name) is None, f"unexpected standalone dependency: {name}"
          PY
          make test-python PYTHON=python
