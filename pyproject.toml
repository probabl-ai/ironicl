[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "ironicl"
version = "0.1.0"
description = "TabICLv2 classifier inference without PyTorch"
readme = "README.md"
requires-python = ">=3.12"
# Floors are the oldest releases that pass the frozen upstream oracle.
dependencies = [
    "numpy>=2",
    "scikit-learn>=1.7",
    # PowerTransformer fits with SciPy, and older solvers drift from the oracle.
    "scipy>=1.17",
]
license = "BSD-3-Clause"
license-files = ["LICENSE", "LICENSES/TabICL-BSD-3-Clause.txt"]

[tool.maturin]
python-source = "python"
module-name = "ironicl._core"
features = ["python"]
