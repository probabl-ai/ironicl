[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "ironicl"
version = "0.1.0"
description = "TabICLv2 classifier inference without PyTorch"
readme = "README.md"
requires-python = ">=3.12"
# Floors are the oldest releases that pass the frozen upstream oracle.
dependencies = [
    "numpy>=2",
    "scikit-learn>=1.7",
]
license = "BSD-3-Clause"
license-files = [
    "LICENSE",
    "LICENSES/Python-PSF-2.0.txt",
    "LICENSES/TabICL-BSD-3-Clause.txt",
]

[project.optional-dependencies]
# verbose=True shows a progress bar with tqdm, and plain lines without it.
progress = ["tqdm>=4.66"]

[tool.maturin]
python-source = "python"
module-name = "ironicl._core"
features = ["python", "metal"]

# `pyodide build` for Pyodide 314 (Python 3.14 build host): its default flags
# plus WebAssembly SIMD for the kernels.
[tool.pyodide.build]
rustflags = "-C link-arg=-sSIDE_MODULE=2 -C target-feature=+simd128"

[tool.ruff.lint]
# Pyflakes only: catch real errors (unused imports, undefined names, bad
# f-strings) without imposing a formatting or import-order policy on existing
# code. Widen the rule set deliberately, not by default.
select = ["F"]
