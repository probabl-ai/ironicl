[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "ironicl"
version = "0.1.0"
description = "TabICLv2 classifier inference on CPU, without PyTorch"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2,<3",
    "scikit-learn>=1.9,<1.10",
    # PowerTransformer delegates fitting to SciPy. Older solvers drift from
    # the pinned upstream FP32 oracle, so constrain this transitive dependency.
    "scipy>=1.18,<1.19",
]
license = "BSD-3-Clause"
license-files = ["LICENSE", "LICENSES/TabICL-BSD-3-Clause.txt"]

[tool.maturin]
python-source = "python"
module-name = "ironicl._core"
features = ["python"]
